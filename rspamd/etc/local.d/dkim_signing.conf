path         = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/var/lib/rspamd/dkim/selectors.map";
selector     = "default";

sign_authenticated = true;
sign_local         = true;
sign_inbound       = false;

allow_username_mismatch = false;
allow_hdrfrom_mismatch  = false;

use_domain = "header";
use_esld   = false;
